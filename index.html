<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sydney Train Network — Live Map</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
<style>
:root { --ink: #f7ead0; --muted: rgba(247,234,208,.68); --panel: rgba(12,16,30,.82); --gold: #f6c65b; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050713; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
#map { position: fixed; inset: 0; }

/* Overlays */
.topbar { position: fixed; z-index: 4; top: 18px; left: 18px; right: 18px; display: flex; align-items: start; justify-content: space-between; gap: 14px; pointer-events: none; }
.brand { max-width: 560px; }
.eyebrow { color: var(--gold); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; }
h1 { margin: 6px 0 4px; font-size: clamp(22px, 3.2vw, 44px); line-height: .95; letter-spacing: -.045em; text-shadow: 0 0 24px rgba(246,198,91,.25); }
.subtitle { color: var(--muted); font-size: 13px; max-width: 480px; line-height: 1.4; }
.hud { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; max-width: 420px; }
button, .chip { border: 1px solid rgba(247,234,208,.18); background: rgba(11,15,30,.72); color: var(--ink); border-radius: 999px; padding: 9px 12px; font-size: 12px; cursor: pointer; backdrop-filter: blur(12px); }
button:hover, button.active { border-color: rgba(246,198,91,.75); color: #fff4d9; box-shadow: 0 0 20px rgba(246,198,91,.18); }

/* Left dock (line toggles) */
.left-dock { position: fixed; z-index: 4; left: 18px; top: clamp(160px, 18vh, 200px); bottom: 18px; width: min(260px, calc(100vw - 36px)); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; overflow-y: auto; overflow-x: hidden; padding-right: 6px; scrollbar-width: thin; scrollbar-color: rgba(246,198,91,.45) transparent; }
.dock-card { flex: 0 0 auto; background: rgba(7,10,22,.78); border: 1px solid rgba(247,234,208,.14); border-radius: 18px; padding: 10px 12px; backdrop-filter: blur(16px); }
.legend-title { font-size: 11px; color: var(--gold); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 9px; font-weight: 800; }
.legend-row { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; margin: 6px 0; cursor: pointer; }
.legend-row:hover { color: #fff; }
.legend-row.hidden-line { opacity: .35; }
.swatch { width: 22px; height: 3px; border-radius: 4px; box-shadow: 0 0 12px currentColor; flex: 0 0 auto; }

/* Right panel (departures / station info) */
.panel { position: fixed; z-index: 4; right: 18px; bottom: 78px; width: min(380px, calc(100vw - 36px)); max-height: min(520px, calc(100vh - 140px)); overflow: auto; padding: 16px; background: var(--panel); border: 1px solid rgba(247,234,208,.14); border-radius: 22px; backdrop-filter: blur(18px); box-shadow: 0 24px 70px rgba(0,0,0,.4); scrollbar-width: thin; scrollbar-color: rgba(246,198,91,.45) transparent; display: none; }
.panel.show { display: block; }
.panel h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
.panel p { color: var(--muted); line-height: 1.5; margin: 0 0 12px; font-size: 13px; }
.departure { border: 1px solid rgba(247,234,208,.12); background: rgba(255,255,255,.04); border-radius: 14px; padding: 10px; margin-bottom: 8px; }
.departure b { display: block; color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: .11em; margin-bottom: 6px; }
.departure span { color: rgba(247,234,208,.72); font-size: 12px; line-height: 1.35; display: block; }
.close-panel { float: right; background: transparent; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0; margin: -4px -4px 0 0; }
.close-panel:hover { color: #fff; }

/* Toast */
.toast { position: fixed; z-index: 5; left: 50%; bottom: 28px; transform: translateX(-50%); color: rgba(247,234,208,.72); font-size: 12px; background: rgba(6,8,16,.7); border: 1px solid rgba(247,234,208,.12); border-radius: 999px; padding: 8px 12px; pointer-events: none; opacity: 0; transition: opacity .4s; }
.toast.show { opacity: 1; }

/* Live train markers */
.train-marker { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,.6); box-shadow: 0 0 10px currentColor; pointer-events: none; }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <div class="eyebrow">NSW Transport Open Data</div>
    <h1>Sydney Train Network</h1>
    <div class="subtitle">248 stations · Real-time positions · Click any station</div>
  </div>
  <div class="hud">
    <button id="btnLive">Live: Off</button>
    <button id="btnAll">Show All Lines</button>
  </div>
</div>

<div class="left-dock" id="legendDock"></div>

<div class="panel" id="stationPanel">
  <button class="close-panel" id="btnClosePanel">×</button>
  <h2 id="pName">Station</h2>
  <p id="pDesc"></p>
  <div id="pDepartures"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================  Mapbox setup (token fetched from serverless config)  ===================== */
let map;
async function initMap() {
  const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const configUrl = isLocal ? 'http://localhost:8766/api/config' : '/api/config';
  let token = null;
  try {
    const res = await fetch(configUrl);
    if (res.ok) {
      const data = await res.json();
      token = data.token;
    }
  } catch (e) { /* no local proxy */ }
  if (!token) token = 'YOUR_MAPBOX_TOKEN_HERE'; // fallback placeholder
  mapboxgl.accessToken = token;

  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [151.2, -33.87],
    zoom: 11.2,
    pitch: 0,
    attributionControl: false
  });
  map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-right');
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

  map.on('load', () => {
    loadNetwork().then(() => showToast('Network loaded'));
  });
}
initMap();
let NODES = [];
let LINKS = [];
let LINE_COLORS = {};
const hiddenLines = new Set();
let liveOn = false;
let selectedNode = null;
let liveFetchInterval = null;
let liveInterval = null;

const GTFS_API = (() => {
  const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  return isLocal ? "http://localhost:8766/api/gtfs_vehiclepos" : "/api/gtfs_vehiclepos";
})();

/* =====================  Load network data  ===================== */
async function loadNetwork() {
  const res = await fetch('network_data.json');
  const data = await res.json();
  NODES = data.nodes;
  // links array: [sourceId, targetId, lineKey, lineLabel, weight]
  LINKS = data.links.map(l => ({ source: l[0], target: l[1], line: l[2], label: l[3], weight: l[4] }));
  LINE_COLORS = data.line_colors;
  buildMapLayers();
  buildLegend();
}

/* =====================  Build GeoJSON & Layers  ===================== */
function buildMapLayers() {
  // --- Stations (circles) ---
  const stationFeatures = NODES.map(n => ({
    type: 'Feature',
    properties: {
      id: n.id,
      label: n.label,
      lines: n.lines || [],
      desc: n.desc || ''
    },
    geometry: { type: 'Point', coordinates: [n.lon, n.lat] }
  }));

  map.addSource('source-stations', { type: 'geojson', data: { type: 'FeatureCollection', features: stationFeatures } });

  map.addLayer({
    id: 'layer-stations-bg',
    type: 'circle',
    source: 'source-stations',
    paint: {
      'circle-radius': 5,
      'circle-color': '#0b0f1e',
      'circle-stroke-color': '#f6c65b',
      'circle-stroke-width': 1.5,
      'circle-opacity': 0.9
    }
  });

  map.addLayer({
    id: 'layer-stations-label',
    type: 'symbol',
    source: 'source-stations',
    layout: {
      'text-field': ['get', 'label'],
      'text-size': 11,
      'text-offset': [0, 1.2],
      'text-anchor': 'top',
      'text-font': ['Open Sans SemiBold', 'Arial Unicode MS Bold']
    },
    paint: {
      'text-color': 'rgba(247,234,208,.85)',
      'text-halo-color': '#050713',
      'text-halo-width': 1.8
    }
  });

  // Station click
  map.on('click', 'layer-stations-bg', (e) => {
    const feature = e.features[0];
    selectStation(feature);
  });
  map.on('mouseenter', 'layer-stations-bg', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'layer-stations-bg', () => map.getCanvas().style.cursor = '');
}

/* =====================  Legend & Toggles  ===================== */
function buildLegend() {
  const dock = document.getElementById('legendDock');
  const lines = Object.keys(LINE_COLORS).sort();

  const card = document.createElement('div');
  card.className = 'dock-card';
  card.innerHTML = '<div class="legend-title">Lines</div>';

  lines.forEach(line => {
    const color = LINE_COLORS[line];
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.dataset.line = line;
    row.innerHTML = `<div class="swatch" style="background:${color};color:${color}"></div><span>${line.toUpperCase()}</span>`;
    row.addEventListener('click', () => toggleLine(line, row));
    card.appendChild(row);
  });

  dock.appendChild(card);
}

function toggleLine(line, rowEl) {
  if (hiddenLines.has(line)) {
    hiddenLines.delete(line);
    rowEl.classList.remove('hidden-line');
  } else {
    hiddenLines.add(line);
    rowEl.classList.add('hidden-line');
  }
  updateStationVisibility();
  updateLiveVisibility();
}

function updateStationVisibility() {
  const filter = ['any'];
  const allHidden = hiddenLines.size > 0 && hiddenLines.size === Object.keys(LINE_COLORS).length;
  if (allHidden) {
    map.setLayoutProperty('layer-stations-bg', 'visibility', 'none');
    map.setLayoutProperty('layer-stations-label', 'visibility', 'none');
    return;
  }
  map.setLayoutProperty('layer-stations-bg', 'visibility', 'visible');
  map.setLayoutProperty('layer-stations-label', 'visibility', 'visible');

  // Show station if at least one of its lines is visible
  const visible = Object.keys(LINE_COLORS).filter(l => !hiddenLines.has(l));
  if (visible.length === 0) return;
  // filter: any line in properties.lines overlaps visible
  // Mapbox expression: any of the station's lines is NOT in hiddenLines
  const expr = ['any'];
  visible.forEach(l => expr.push(['in', l, ['get', 'lines']]));
  map.setFilter('layer-stations-bg', expr);
  map.setFilter('layer-stations-label', expr);
}

/* =====================  Station selection & departures  ===================== */
function selectStation(feature) {
  const props = feature.properties;
  const coords = feature.geometry.coordinates;
  selectedNode = { id: props.id, label: props.label, lat: coords[1], lon: coords[0] };
  document.getElementById('pName').textContent = props.label;
  document.getElementById('pDesc').textContent = props.desc || '';
  document.getElementById('stationPanel').classList.add('show');
  fetchDepartures(selectedNode);
  map.flyTo({ center: coords, zoom: 14, speed: 0.8 });
}

document.getElementById('btnClosePanel').addEventListener('click', () => {
  document.getElementById('stationPanel').classList.remove('show');
  selectedNode = null;
});

async function fetchDepartures(n) {
  const container = document.getElementById('pDepartures');
  const url = `/api/departure_mon?stopId=${encodeURIComponent(n.id)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) { container.innerHTML = `<div class="departure"><span>API error ${res.status}</span></div>`; return; }
    const data = await res.json();
    renderDepartures(data);
  } catch (err) {
    container.innerHTML = `<div class="departure"><span>Network error: ${err.message}</span></div>`;
  }
}

function renderDepartures(data) {
  const container = document.getElementById('pDepartures');
  if (!data || !data.stopEvents) { container.innerHTML = '<div class="departure"><span>No departures found.</span></div>'; return; }
  const now = new Date();
  let html = '';
  data.stopEvents.slice(0, 8).forEach(ev => {
    const dt = new Date(ev.departureTimeEstimated || ev.departureTimePlanned);
    const mins = Math.round((dt - now) / 60000);
    const timeStr = dt.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    const line = (ev.transportation?.number || ev.transportation?.symbol || '—');
    const dest = ev.transportation?.destination?.name || 'Unknown';
    const status = mins <= 0 ? 'Due' : `${mins} min`;
    html += `<div class="departure"><b>${line} to ${dest}</b><span>${timeStr} · ${status}</span></div>`;
  });
  container.innerHTML = html || '<div class="departure"><span>No upcoming departures.</span></div>';
}

/* =====================  Live Mode  ===================== */
const liveMarkers = []; // { id, marker, targetLngLat, currentLngLat, line }

// Internal route codes from GTFS-Realtime feed → our line keys
const GTFS_ROUTE_MAP = {
  'T1': 't1', 'T2': 't2', 'T3': 't3', 'T4': 't4', 'T5': 't5', 'T6': 't6', 'T7': 't7', 'T8': 't8', 'T9': 't9',
  'CCN': 'ccn', 'SCO': 'sco', 'BMT': 'bmt', 'WST': 'wst', 'NRC': 'nrc', 'NRW': 'nrw',
  'SHL': 'shl', 'STH': 'sth',
  // Internal operator route codes → line mapping
  'APS': 't8',     // Airport & South Line
  'ESI': 't4',     // Eastern Suburbs & Illawarra
  'IWL': 't2',     // Inner West & Leppington
  'WST': 't1',     // Western (interchange with T1)
  'NTH': 't9',     // Northern
  'NSN': 't9',     // North Shore (also T1)
  'CMB': 't2',     // Cumberland (part of T2)
  'OLY': 't7',     // Olympic Park (part of T7)
};

const IGNORED_ROUTES = new Set(['RTTA_DEF', 'RTTA_REV', 'RTTA']);

function routeToLine(routeId, tripId) {
  if (!routeId) {
    // Try to infer from trip for NonTimetabled yard trains
    if (tripId && tripId.startsWith('NonTimetabled')) return null;
    return null;
  }
  // Ignore yard / service trains
  if (IGNORED_ROUTES.has(routeId)) return null;
  // Direct prefix match
  for (const [prefix, line] of Object.entries(GTFS_ROUTE_MAP)) {
    if (routeId === prefix || routeId.startsWith(prefix + '_')) return line;
  }
  return null;
}

async function fetchLiveTrains() {
  try {
    const res = await fetch(GTFS_API, { method: 'GET', headers: { 'Accept': 'application/json' } });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.trains) return;
    updateLiveMarkers(data.trains);
  } catch (e) { console.warn('Live fetch failed:', e); }
}

function updateLiveMarkers(trainData) {
  const visibleIds = new Set();
  trainData.forEach(t => {
    if (t.lat == null || t.lon == null) return;
    // Metro Sydney bounds
    if (t.lon < 150.7 || t.lon > 151.6 || t.lat < -34.3 || t.lat > -33.5) return;
    const line = routeToLine(t.route, t.trip);
    if (line && hiddenLines.has(line)) return;

    // Stable ID: use tripId since entity.id is just a row number
    const stableId = t.trip || t.id;
    let lm = liveMarkers.find(m => m.id === stableId);
    if (!lm) {
      const el = document.createElement('div');
      el.className = 'train-marker';
      const color = LINE_COLORS[line] || '#ff00ff';
      el.style.background = color;
      el.style.color = color;
      const marker = new mapboxgl.Marker({ element: el, anchor: 'center' }).setLngLat([t.lon, t.lat]).addTo(map);
      lm = { id: stableId, marker, line, currentLngLat: [t.lon, t.lat], targetLngLat: [t.lon, t.lat], speedMps: t.speed, bearing: t.bearing };
      liveMarkers.push(lm);
    } else {
      lm.targetLngLat = [t.lon, t.lat];
      lm.speedMps = t.speed;
      lm.bearing = t.bearing;
    }
    visibleIds.add(stableId);
  });

  // Remove disappeared trains
  for (let i = liveMarkers.length - 1; i >= 0; i--) {
    if (!visibleIds.has(liveMarkers[i].id)) {
      liveMarkers[i].marker.remove();
      liveMarkers.splice(i, 1);
    }
  }
}

function updateLiveVisibility() {
  liveMarkers.forEach(m => {
    const el = m.marker.getElement();
    if (!el) return;
    if (m.line && hiddenLines.has(m.line)) {
      el.style.display = 'none';
    } else {
      el.style.display = '';
    }
  });
}

function runAnimation() {
  liveMarkers.forEach(m => {
    if (!m.targetLngLat || !m.currentLngLat) return;
    let [lng, lat] = m.currentLngLat;

    // Dead-reckoning: use speed + bearing to keep moving between updates
    if (m.speedMps && typeof m.bearing === 'number') {
      const brng = m.bearing * (Math.PI / 180);
      const dist = m.speedMps * (1 / 60); // metres per frame (~60fps)
      const R = 6371000;
      const latRad = lat * (Math.PI / 180);
      lng += (dist * Math.sin(brng)) / (R * Math.cos(latRad)) * (180 / Math.PI);
      lat += (dist * Math.cos(brng)) / R * (180 / Math.PI);
    }

    // Soft GPS correction: slowly lerp toward latest known position
    const [tLng, tLat] = m.targetLngLat;
    lng += (tLng - lng) * 0.02;
    lat += (tLat - lat) * 0.02;

    m.currentLngLat = [lng, lat];
    m.marker.setLngLat([lng, lat]);
  });
  requestAnimationFrame(runAnimation);
}
requestAnimationFrame(runAnimation);

/* =====================  Live Toggle  ===================== */
document.getElementById('btnLive').addEventListener('click', () => {
  liveOn = !liveOn;
  const btn = document.getElementById('btnLive');
  btn.textContent = liveOn ? 'Live: On' : 'Live: Off';
  btn.classList.toggle('active', liveOn);

  if (liveOn) {
    fetchLiveTrains();
    if (!liveFetchInterval) liveFetchInterval = setInterval(fetchLiveTrains, 10000);
    showToast('Live train positions enabled');
    if (selectedNode) { fetchDepartures(selectedNode); liveInterval = setInterval(() => { if (selectedNode) fetchDepartures(selectedNode); }, 30000); }
  } else {
    if (liveFetchInterval) { clearInterval(liveFetchInterval); liveFetchInterval = null; }
    if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
    liveMarkers.forEach(m => m.marker.remove());
    liveMarkers.length = 0;
    showToast('Live mode off');
  }
});

document.getElementById('btnAll').addEventListener('click', () => {
  hiddenLines.clear();
  document.querySelectorAll('.legend-row').forEach(r => r.classList.remove('hidden-line'));
  updateStationVisibility();
  updateLiveVisibility();
  showToast('All lines visible');
});

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

/* =====================  Init  ===================== */
map.on('load', () => {
  loadNetwork().then(() => showToast('Network loaded'));
});
</script>
</body>
</html>
